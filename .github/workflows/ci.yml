name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs what rust-toolchain.toml pins: the compiler, clippy, rustfmt.
      - run: rustup toolchain install
      - name: Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libwebkit2gtk-4.1-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # --locked: fail when Cargo.lock is out of date instead of rewriting it.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The release profile (thin LTO, one codegen unit) is what ships.
      - run: cargo build --workspace --release --locked
