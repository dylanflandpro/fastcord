[package]
name = "fastcord-captcha"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Shows Discord's captcha for fastcord, in its own process"
publish = false

[dependencies]
gtk = "0.18"
javascriptcore-rs = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webkit2gtk = { version = "2", features = ["v2_40"] }
