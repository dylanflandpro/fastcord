# The captcha helper is its own package so WebKit never reaches the main
# binary: fastcord starts it only when Discord asks for a captcha.
[workspace]
members = ["crates/captcha"]
# `cargo build` and `cargo test` cover the helper too; `cargo run` only
# builds what it runs, so build the workspace before signing in.
default-members = [".", "crates/captcha"]

[package]
name = "fastcord"
default-run = "fastcord"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "A native Discord client built with Rust and egui"
repository = "https://github.com/dylanflandpro/fastcord"
keywords = ["discord", "chat", "egui"]
categories = ["gui"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
directories = "6"
jiff = "0.2"
# The whole interface. glow keeps the binary and the dependency tree small.
eframe = { version = "0.36.1", default-features = false, features = ["accesskit", "glow", "default_fonts", "wayland", "x11"] }
egui = "0.36.1"
egui_extras = { version = "0.36.1", features = ["svg"] }
# The foundation Spotifast and ZapFast share, taken piece by piece. Every
# crate comes from the same tag; move them together.
fastframe-text = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
fastframe-fonts = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
fastframe-emoji = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
fastframe-icons = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
fastframe-theme = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
fastframe-log = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
tokio = { version = "1.53.2", features = ["rt", "macros", "time", "sync", "net", "process", "io-util"] }
tokio-websockets = { version = "0.13.3", default-features = false, features = ["client", "rustls-native-roots", "ring", "rand"] }
rsa = { version = "0.9.10", features = ["sha2", "getrandom"] }
base64 = "0.23"
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
zeroize = "1.9.1"
keyring-core = "1.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
http = "1.5.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
thiserror = "2.0.21"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-async-io-crypto-rust"] }

# Generating the sign-in key takes seconds unoptimised; these crates are
# built optimised even in debug builds.
[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.num-bigint-dig]
opt-level = 3
